name: Ellenőrzés

on:
  push:
  pull_request:

jobs:
  minoseg:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hc_dev:hc_dev@localhost:5432/hc_webaruhaz?schema=public
    services:
      adatbazis:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hc_dev
          POSTGRES_PASSWORD: hc_dev
          POSTGRES_DB: hc_webaruhaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hc_dev -d hc_webaruhaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --configLoader runner
        env:
          ORDER_PRIVACY_NOTICE_VERSION: helyi-fejlesztes
          ORDER_SALES_TERMS_VERSION: helyi-fejlesztes
      - name: Worker szabályos leállításának próbája
        shell: bash
        run: |
          naplo="${RUNNER_TEMP}/worker-leallas.log"
          node --conditions=react-server --import tsx src/worker/feldolgozo.ts >"$naplo" 2>&1 &
          worker_pid=$!
          takaritas() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap takaritas EXIT
          for _ in {1..30}; do
            if grep -q 'worker.started' "$naplo"; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat "$naplo"; exit 1; fi
            sleep 1
          done
          if ! grep -q 'worker.started' "$naplo"; then cat "$naplo"; exit 1; fi
          kill -TERM "$worker_pid"
          for _ in {1..15}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$worker_pid" 2>/dev/null; then
            echo "A worker nem állt le 15 másodpercen belül."
            cat "$naplo"
            exit 1
          fi
          wait "$worker_pid"
          if ! grep -q 'worker.stopped' "$naplo"; then cat "$naplo"; exit 1; fi
          cat "$naplo"
      - run: npm run build
