name: Ellenőrzés

on:
  push:
  pull_request:

jobs:
  minoseg:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hc_dev:hc_dev@localhost:5432/hc_webaruhaz?schema=public
    services:
      adatbazis:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hc_dev
          POSTGRES_PASSWORD: hc_dev
          POSTGRES_DB: hc_webaruhaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hc_dev -d hc_webaruhaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --configLoader runner
        env:
          ORDER_PRIVACY_NOTICE_VERSION: helyi-fejlesztes
          ORDER_SALES_TERMS_VERSION: helyi-fejlesztes
      - run: npm run build
